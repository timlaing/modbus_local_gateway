composite:
  current_time:
    name: Current Time
    type: datetime
    data_type: read_write_word
    fields:
      year:
        address: 45
      month:
        address: 46
      day:
        address: 47
      hour:
        address: 48
      minute:
        address: 49
      second:
        address: 50
  # Time-of-use windows 1-9: minute in bits 0-7 and hour in bits 8-12 of one
  # holding register, read and written without disturbing the mode and enable
  # bits that share the end time register.
  period1_end:
    name: Period 1 End Time
    type: time
    data_type: read_write_word
    fields:
      minute:
        address: 3038
        bits: 8
        shift_bits: 0
      hour:
        address: 3038
        bits: 5
        shift_bits: 8
