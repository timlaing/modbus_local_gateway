device:
  manufacturer: Growatt
  model: MOD 6000TL-X
  max_register_read: 5

read_write_word:
  hw_version:
    name: Firmware version
    address: 9
    size: 3
    string: true
  sw_version:
    name: Control firmware version
    address: 12
    size: 3
    string: true
  serial_no:
    name: Serial Number
    address: 3001
    size: 14
    string: true
  on_off:
    name: Remote On/Off
    address: 0
    control: switch
    icon: mdi:power
    switch:
      "off": 0
      "on": 1
  max_output_active:
    name: Max output active power
    address: 3
    control: number
    icon: mdi:flash
    precision: 0
    number:
      min: 0
      max: 100
    unit_of_measurement: "%"
  language:
    name: LCD language
    address: 15
    control: select
    options:
      0: Italian
      1: English
      2: German
      3: Spanish
      4: French
      5: Chinese
      6: Polish
      7: Portuguese
      8: Hungarian
  com_address:
    name: Communicate address
    address: 3085
    control: number
    icon: mdi:serial-port
    precision: 0
    number:
      min: 1
      max: 254
  GridFirstDischargePowerRate:
    name: Discharge Power Rate (Grid First)
    address: 3036
    control: number
    icon: mdi:transmission-tower-export
    precision: 0
    number:
      min: 1
      max: 255
  GridFirstStopSOC:
    name: Stop Discharge SOC (Grid First)
    address: 3037
    control: number
    icon: mdi:battery-negative
    precision: 0
    number:
      min: 1
      max: 100
    unit_of_measurement: "%"
  BatFirstDischargePowerRate:
    name: Discharge Power Rate (Bat First)
    address: 3047
    control: number
    icon: mdi:transmission-tower-import
    precision: 0
    number:
      min: 1
      max: 100
  BatFirstStopSOC:
    name: Stop Charge SOC (Bat First)
    address: 3048
    control: number
    icon: mdi:battery-charging
    precision: 0
    number:
      min: 1
      max: 100
    unit_of_measurement: "%"
  AcChargeEnable:
    name: AC Charge Enable
    address: 3049
    control: switch
    icon: mdi:transmission-tower
    switch:
      "off": 0
      "on": 1

  # Time-of-use windows 1-9: the end time word of each pair carries the charge
  # mode in bits 13-14 and the enable flag in bit 15, and the start time word
  # (one register higher) leaves those bits reserved. All of it is holding
  # registers, so the windows can be set from Home Assistant.
  period1_mode:
    name: Period 1 Mode
    address: 3038
    control: select
    bits: 2
    shift_bits: 13
    options:
      0: Load
      1: Battery
      2: Grid
  period1_enable:
    name: Period 1 Enable
    address: 3038
    control: switch
    bits: 1
    shift_bits: 15
  period2_mode:
    name: Period 2 Mode
    address: 3040
    control: select
    bits: 2
    shift_bits: 13
    options:
      0: Load
      1: Battery
      2: Grid
  period2_enable:
    name: Period 2 Enable
    address: 3040
    control: switch
    bits: 1
    shift_bits: 15
  period3_mode:
    name: Period 3 Mode
    address: 3042
    control: select
    bits: 2
    shift_bits: 13
    options:
      0: Load
      1: Battery
      2: Grid
  period3_enable:
    name: Period 3 Enable
    address: 3042
    control: switch
    bits: 1
    shift_bits: 15
  period4_mode:
    name: Period 4 Mode
    address: 3044
    control: select
    bits: 2
    shift_bits: 13
    options:
      0: Load
      1: Battery
      2: Grid
  period4_enable:
    name: Period 4 Enable
    address: 3044
    control: switch
    bits: 1
    shift_bits: 15
  period5_mode:
    name: Period 5 Mode
    address: 3050
    control: select
    bits: 2
    shift_bits: 13
    options:
      0: Load
      1: Battery
      2: Grid
  period5_enable:
    name: Period 5 Enable
    address: 3050
    control: switch
    bits: 1
    shift_bits: 15
  period6_mode:
    name: Period 6 Mode
    address: 3052
    control: select
    bits: 2
    shift_bits: 13
    options:
      0: Load
      1: Battery
      2: Grid
  period6_enable:
    name: Period 6 Enable
    address: 3052
    control: switch
    bits: 1
    shift_bits: 15
  period7_mode:
    name: Period 7 Mode
    address: 3054
    control: select
    bits: 2
    shift_bits: 13
    options:
      0: Load
      1: Battery
      2: Grid
  period7_enable:
    name: Period 7 Enable
    address: 3054
    control: switch
    bits: 1
    shift_bits: 15
  period8_mode:
    name: Period 8 Mode
    address: 3056
    control: select
    bits: 2
    shift_bits: 13
    options:
      0: Load
      1: Battery
      2: Grid
  period8_enable:
    name: Period 8 Enable
    address: 3056
    control: switch
    bits: 1
    shift_bits: 15
  period9_mode:
    name: Period 9 Mode
    address: 3058
    control: select
    bits: 2
    shift_bits: 13
    options:
      0: Load
      1: Battery
      2: Grid
  period9_enable:
    name: Period 9 Enable
    address: 3058
    control: switch
    bits: 1
    shift_bits: 15
read_only_word:
  machine_status:
    name: Inverter Machine Status
    address: 3000
    map:
      0: Standby
      1: Normal
      3: Fault
      4: Flash
    bits: 8
  run_status:
    name: Inverter Run Status
    address: 3000
    map:
      0: Waiting module
      1: Self-test
      3: SysFault module
      4: Flash module
      5: PVBATOnline module
      6: BatOnline module
      7: PVOffline mode
      8: BatOffline mode
    shift_bits: 8
    bits: 8
  Ppv:
    address: 3001
    name: PV total power
    unit_of_measurement: Watts
    precision: 2
    size: 2
    multiplier: 0.1
  Vpv1:
    name: PV1 voltage
    address: 3003
    unit_of_measurement: Volts
    precision: 2
    multiplier: 0.1
  PV1Curr:
    name: PV1 input current
    address: 3004
    unit_of_measurement: Amps
    precision: 2
    multiplier: 0.1
  Ppv1:
    address: 3005
