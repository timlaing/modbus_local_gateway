name: Workflow policy
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: node --test .github/scripts/quality-review.test.cjs
      - run: python3 -I .github/scripts/test_workflow_policy.py
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
      - run: python3 -I -m unittest discover -s .github/scripts -p test_action_pins.py -v
      - run: python3 -I .github/scripts/action_pins.py
