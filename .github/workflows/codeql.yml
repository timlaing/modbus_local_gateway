name: CodeQL
"on":
  push: null
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: ${{ matrix.language == 'python' && 'Analyze' || format('CodeQL {0}', matrix.language) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
  validation-result:
    name: Validate codeql
    needs:
      - analyze
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run:
          "python3 -I - <<'PY'\nimport json, os\nresults = json.loads(os.environ['RESULTS'])\nfailed = [name for name, job\
          \ in results.items() if job['result'] != 'success']\nif failed:\n    raise SystemExit('Validation incomplete: ' +\
          \ ', '.join(failed))\nPY\n"
