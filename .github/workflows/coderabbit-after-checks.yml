name: CodeRabbit after checks
"on":
  workflow_run:
    workflows:
      - Workflow policy
      - Action references
      - CodeQL
      - Validate with HACS
      - Validate with hassfest
      - Linting
      - Tests
    types:
      - completed
  workflow_dispatch:
    inputs:
      revision:
        description: Current PR head SHA to validate
        required: true
        type: string
permissions: {}
concurrency:
  group: review-${{ github.event.workflow_run.head_sha || inputs.revision }}
  cancel-in-progress: false
jobs:
  review:
    name: CodeRabbit after checks
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REQUIRED_CHECKS:
            '["Validate action-refs", "Validate codeql", "Validate hacs-validate", "Validate hassfest-validate",
            "Validate linting", "Validate tests", "Analysis passed", "Workflow policy"]'
          REVISION: ${{ inputs.revision }}
        with:
          script: |
            const { run } = require('./.github/scripts/quality-review.cjs');
            await run({ github, context, core });
