name: Dependabot Auto Merge
"on":
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if:
      github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name
      == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify dependency update
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        with:
          script: |
            // Preserve the existing unattended patch/minor policy.
            if (!["version-update:semver-patch", "version-update:semver-minor"].includes(process.env.UPDATE_TYPE)) return;
            const pr = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
            if (current.state !== 'open' || current.head.sha !== pr.head.sha || current.user.login !== 'dependabot[bot]')
              throw new Error('Dependabot revision changed');
            // Queue native auto-merge. Never merge directly or bypass branch protection.
            await github.graphql(`mutation($id: ID!, $oid: GitObjectID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, expectedHeadOid: $oid, mergeMethod: SQUASH}) {
                pullRequest { number }
              }
            }`, { id: current.node_id, oid: current.head.sha });
