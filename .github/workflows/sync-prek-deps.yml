name: Sync prek dependencies

# Dependabot only bumps the requirements files; it never runs
# scripts/sync_prek_deps.py, so the generated blocks in
# .pre-commit-config.yaml go stale and the check-prek-deps hook fails the
# prek job. This regenerates them on the Dependabot branch so the checks
# can pass unattended.
#
# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
    paths:
      - "requirements*.txt"

permissions:
  contents: write

concurrency:
  group: sync-prek-deps-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync-prek-deps
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Regenerate prek additional_dependencies
        run: python3 scripts/sync_prek_deps.py requirements_all.txt

      - name: Commit and push
        run: |
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "prek dependencies are already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pre-commit-config.yaml
          git commit -m "chore: sync prek dependencies with requirements"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
